<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Mô Hình Chim (Sửa lỗi iOS)</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #distance-hud {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 24px;
        border-radius: 20px; font-family: sans-serif; font-size: 14px;
        z-index: 999; text-align: center; width: 80%; max-width: 300px;
      }
      #start-btn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 15px 30px; background: #2ecc71; color: white; border: none;
        border-radius: 10px; font-size: 16px; font-weight: bold; z-index: 1000;
        cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <button id="start-btn" onclick="initGPS()">BẮT ĐẦU ỨNG DỤNG AR</button>
    <div id="distance-hud" style="display: none;">Đang kết nối GPS vệ tinh...</div>
    
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="bird-obj" src="10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>
      
      <a-entity 
        id="ar-object"
        gps-entity-place="latitude: 10.4212398; longitude: 105.6433481;"
        position="0 0 0"
        scale="0.25 0.25 0.25"
        rotation="0 0 0"
        visible="false">
        <a-obj-model src="#bird-obj" mtl="#bird-mtl"></a-obj-model>
      </a-entity>
      
      <a-entity id="main-camera" camera gps-camera="gpsMinDistance: 1; maxDistance: 100;" rotation-reader></a-entity>
      
    </a-scene>

    <script>
      const arObject = document.getElementById('ar-object');
      const hud = document.getElementById('distance-hud');
      const startBtn = document.getElementById('start-btn');
      const cameraEl = document.getElementById('main-camera');
      let gpsSuccess = false;

      function initGPS() {
        startBtn.style.display = 'none';
        hud.style.display = 'block';

        // Cố gắng gọi GPS thật của máy
        navigator.geolocation.getCurrentPosition(
          (position) => {
            gpsSuccess = true;
            hud.innerHTML = "Đã nhận GPS thật! Đang tính khoảng cách...";
          },
          (err) => {
            console.log("Lỗi định vị thực tế, chuyển sang chế độ kích hoạt khẩn cấp.");
          },
          { enableHighAccuracy: true, timeout: 6000 }
        );

        // BỘ CỨU NGUY: Sau 7 giây nếu iOS vẫn chặn GPS, tự động kích hoạt mô hình trước mặt bạn luôn
        setTimeout(() => {
          if (!gpsSuccess) {
            hud.innerHTML = "iOS chặn GPS! Đã tự động kích hoạt mô hình cách bạn 15m";
            hud.style.background = "rgba(230, 126, 34, 0.9)"; // Màu cam cảnh báo bảo mật
            
            // Xóa bỏ thuộc tính GPS bị kẹt
            arObject.removeAttribute('gps-entity-place');
            cameraEl.removeAttribute('gps-camera');
            
            // Đặt mô hình ngay trước mắt camera (trục Z âm là phía trước mặt)
            arObject.setAttribute('position', '0 0 -15'); 
            arObject.setAttribute('visible', 'true');
          }
        }, 7000);
      }

      // Xử lý khi GPS thật hoạt động ổn định
      window.addEventListener('gps-camera-update-position', (e) => {
        gpsSuccess = true;
        const distance = arObject.components['gps-entity-place'] ? arObject.components['gps-entity-place'].distance : null;

        if (distance !== null && distance !== undefined) {
          const roundedDistance = Math.round(distance);
          if (roundedDistance <= 100) {
            arObject.setAttribute('visible', 'true');
            hud.innerHTML = `Đã kết nối GPS! Cách mục tiêu: ${roundedDistance}m`;
            hud.style.background = "rgba(46, 204, 113, 0.9)";
          } else {
            arObject.setAttribute('visible', 'false');
            hud.innerHTML = `Mục tiêu cách bạn: ${roundedDistance}m (Hãy lại gần < 100m)`;
            hud.style.background = "rgba(231, 76, 60, 0.9)";
          }
        }
      });
    </script>
  </body>
</html>
