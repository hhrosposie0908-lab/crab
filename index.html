<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Săn Tìm Con Cua - GPS Thực Tế</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #distance-hud {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 24px;
        border-radius: 20px; font-family: sans-serif; font-size: 14px;
        z-index: 999; text-align: center; width: 80%; max-width: 300px;
        font-weight: bold;
      }
      #start-btn {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        padding: 15px 30px; background: #2ecc71; color: white; border: none;
        border-radius: 10px; font-size: 16px; font-weight: bold; z-index: 1000;
        cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <button id="start-btn" onclick="startTreasureHunt()">BẮT ĐẦU DÒ TÌM KHO BÁU</button>
    <div id="distance-hud" style="display: none;">Đang kết nối vệ tinh GPS...</div>
    
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="bird-obj" src="10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>
      
      <a-entity 
        id="ar-object"
        gps-entity-place="latitude: 10.4212398; longitude: 105.6433481;"
        position="0 0 0"
        scale="0.25 0.25 0.25"
        rotation="0 0 0"
        visible="false">
        <a-obj-model src="#bird-obj" mtl="#bird-mtl"></a-obj-model>
      </a-entity>
      
      <a-entity camera gps-camera="gpsMinDistance: 1; maxDistance: 1000;" rotation-reader></a-entity>
      
    </a-scene>

    <script>
      const arObject = document.getElementById('ar-object');
      const hud = document.getElementById('distance-hud');
      const startBtn = document.getElementById('start-btn');

      // Tọa độ mục tiêu cố định
      const TARGET_LAT = 10.4212398;
      const TARGET_LNG = 105.6433481;

      // Công thức toán học Haversine tự tính khoảng cách độc lập để ép hiển thị HUD
      function getPrecisionDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Bán kính Trái Đất (mét)
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      }

      function queryLocation() {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const uLat = position.coords.latitude;
            const uLng = position.coords.longitude;

            // Tự tính số mét thực tế từ người chơi đến con cua
            const exactDist = getPrecisionDistance(uLat, uLng, TARGET_LAT, TARGET_LNG);
            const displayDist = Math.round(exactDist);

            // LOGIC SĂN TÌM TRONG/NGOÀI 100M
            if (displayDist <= 100) {
              arObject.setAttribute('visible', 'true');
              hud.innerHTML = `MỤC TIÊU Ở GẦN! Con cua cách bạn: ${displayDist}m`;
              hud.style.background = "rgba(46, 204, 113, 0.9)"; // Màu xanh lá khi đạt yêu cầu
            } else {
              arObject.setAttribute('visible', 'false'); // Giấu biệt con cua đi nếu ở xa
              hud.innerHTML = `Đang tìm kiếm... Cách mục tiêu: ${displayDist}m (Cần vào < 100m)`;
              hud.style.background = "rgba(230, 126, 34, 0.9)"; // Màu cam chế độ dò tìm xa
            }
          },
          (err) => {
            hud.innerHTML = "Lỗi: Vui lòng mở bằng Safari ngoài và bật Vị trí chính xác!";
            hud.style.background = "rgba(231, 76, 60, 0.9)";
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      }

      function startTreasureHunt() {
        startBtn.style.display = 'none';
        hud.style.display = 'block';

        // Chạy quét vị trí ngay lập tức khi bấm nút
        queryLocation();

        // KÍCH HOẠT VÒNG LẶP CHỦ ĐỘNG: Cứ 2 giây ép hệ thống quét lại tọa độ 1 lần để nhảy số mét
        setInterval(queryLocation, 2000);
      }
    </script>
  </body>
</html>
