<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Săn Tìm Con Cua - Bản Test Tại Chỗ</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #distance-hud {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 24px;
        border-radius: 20px; font-family: sans-serif; font-size: 14px;
        z-index: 999; text-align: center; width: 80%; max-width: 300px;
      }
      #start-btn {
        position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
        padding: 15px 30px; background: #2ecc71; color: white; border: none;
        border-radius: 10px; font-size: 16px; font-weight: bold; z-index: 1000;
        cursor: pointer; box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      }
      /* Nút giả lập đi bộ dành riêng cho bạn test tại nhà */
      #sim-btn {
        position: fixed; top: 20px; right: 20px;
        padding: 10px 15px; background: #3498db; color: white; border: none;
        border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 1001;
        cursor: pointer; display: none;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <button id="start-btn" onclick="initGPS()">BẮT ĐẦU DÒ TÌM</button>
    <button id="sim-btn" onclick="simulateWalking()">GIẢ LẬP ĐI BỘ (-30m)</button>
    
    <div id="distance-hud" style="display: none;">Đang kết nối GPS vệ tinh...</div>
    
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="bird-obj" src="10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>
      
      <a-entity 
        id="ar-object"
        gps-entity-place="latitude: 10.4212398; longitude: 105.6433481;"
        position="0 0 0"
        scale="0.25 0.25 0.25"
        rotation="0 0 0"
        visible="false">
        <a-obj-model src="#bird-obj" mtl="#bird-mtl"></a-obj-model>
      </a-entity>
      
      <a-entity camera gps-camera="gpsMinDistance: 1; maxDistance: 1000;" rotation-reader></a-entity>
      
    </a-scene>

    <script>
      const arObject = document.getElementById('ar-object');
      const hud = document.getElementById('distance-hud');
      const startBtn = document.getElementById('start-btn');
      const simBtn = document.getElementById('sim-btn');

      // Tọa độ thật của con cua
      const TARGET_LAT = 10.4212398;
      const TARGET_LNG = 105.6433481;
      
      let currentDistance = 250; // Khoảng cách giả định ban đầu khi GPS thật chưa phản hồi xong
      let usingSim = false;

      function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const phi1 = lat1 * Math.PI / 180;
        const phi2 = lat2 * Math.PI / 180;
        const deltaPhi = (lat2 - lat1) * Math.PI / 180;
        const deltaLambda = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(deltaPhi/2) * Math.sin(deltaPhi/2) +
                  Math.cos(phi1) * Math.cos(phi2) *
                  Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      }

      function updateHUD(dist) {
        const roundedDistance = Math.round(dist);
        if (roundedDistance <= 100) {
          arObject.setAttribute('visible', 'true');
          // Nếu đang giả lập, chúng ta ép con cua hiện trước mặt luôn để xem được
          if(usingSim) {
            arObject.removeAttribute('gps-entity-place');
            arObject.setAttribute('position', '0 -1 -5'); // Hiện ngay trước camera 5m
          }
          hud.innerHTML = `ĐÃ VÀO PHẠM VI 100m! Con cua cách bạn: ${roundedDistance}m`;
          hud.style.background = "rgba(46, 204, 113, 0.9)"; // Màu xanh lá
        } else {
          arObject.setAttribute('visible', 'false');
          hud.innerHTML = `Đang tìm kiếm... Cách mục tiêu: ${roundedDistance}m (Hãy lại gần < 100m)`;
          hud.style.background = "rgba(230, 126, 34, 0.9)"; // Màu cam
        }
      }

      function initGPS() {
        startBtn.style.display = 'none';
        simBtn.style.display = 'block'; // Hiện nút giả lập lên
        hud.style.display = 'block';

        // Đọc GPS thật
        navigator.geolocation.getCurrentPosition(
          (position) => {
            currentDistance = calculateDistance(position.coords.latitude, position.coords.longitude, TARGET_LAT, TARGET_LNG);
            updateHUD(currentDistance);
          },
          (err) => {
            // Nếu lỗi quyền hoặc đứng im, hiển thị khoảng cách giả lập mặc định để bắt đầu
            updateHUD(currentDistance);
          },
          { enableHighAccuracy: true }
        );

        // Theo dõi liên tục
        navigator.geolocation.watchPosition(
          (position) => {
            if(!usingSim) {
              currentDistance = calculateDistance(position.coords.latitude, position.coords.longitude, TARGET_LAT, TARGET_LNG);
              updateHUD(currentDistance);
            }
          },
          null,
          { enableHighAccuracy: true, maximumAge: 0 }
        );
      }

      // Hàm giả lập khi bấm nút màu xanh dương trên góc màn hình
      function simulateWalking() {
        usingSim = true;
        currentDistance -= 30; // Mỗi lần bấm trừ đi 30 mét giống như đang đi bộ lại gần
        if (currentDistance < 0) currentDistance = 5;
        updateHUD(currentDistance);
      }
    </script>
  </body>
</html>
