<script>
  const arObject = document.getElementById('ar-object');
  const hud = document.getElementById('distance-hud');
  const startBtn = document.getElementById('start-btn');

  function initGPS() {
    startBtn.style.display = 'none';
    hud.style.display = 'block';

    navigator.geolocation.watchPosition(
      (position) => {
        hud.innerHTML = "Đã nhận GPS thật! Đang tạo mục tiêu xung quanh bạn...";
        hud.style.background = "#3498db";

        // LẤY CHÍNH TỌA ĐỘ BẠN ĐANG NGỒI
        const myLat = position.coords.latitude;
        const myLng = position.coords.longitude;

        // Tạo mục tiêu lệch đi một chút (khoảng 10-15 mét về phía Bắc) để bạn nhìn thấy được
        const targetLat = myLat + 0.0001; 
        const targetLng = myLng;

        // Cập nhật tọa độ động này vào con cua
        arObject.setAttribute('gps-entity-place', `latitude: ${targetLat}; longitude: ${targetLng};`);
      },
      (err) => {
        hud.innerHTML = `Lỗi GPS: Vui lòng bật vị trí chính xác!`;
        hud.style.background = "rgba(231, 76, 60, 0.9)";
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }

  // Lắng nghe khoảng cách từ AR.js
  window.addEventListener('gps-camera-update-position', (e) => {
    const distance = arObject.components['gps-entity-place'] ? arObject.components['gps-entity-place'].distance : null;

    if (distance !== null && distance !== undefined) {
      const roundedDistance = Math.round(distance);
      
      // Vì mục tiêu tự động tạo ở gần, bạn sẽ vào thẳng vùng xanh lá này luôn!
      if (roundedDistance <= 100) {
        arObject.setAttribute('visible', 'true');
        hud.innerHTML = `Đã kích hoạt! Con cua cách bạn: ${roundedDistance}m`;
        hud.style.background = "rgba(46, 204, 113, 0.9)"; // Màu xanh lá thành công
      } else {
        arObject.setAttribute('visible', 'false');
        hud.innerHTML = `Mục tiêu ở xa: ${roundedDistance}m (Hãy lại gần < 100m)`;
        hud.style.background = "rgba(231, 76, 60, 0.9)";
      }
    }
  });
</script>
