<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Mô Hình Chim (GPS 100m)</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #distance-hud {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8); color: white; padding: 12px 24px;
        border-radius: 20px; font-family: sans-serif; font-size: 14px;
        z-index: 999; text-align: center; width: 80%; max-width: 300px;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">

    <div id="distance-hud">Đang yêu cầu quyền truy cập GPS...</div>
    
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false" 
      arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="bird-obj" src="10012_crab_v2_iterations-1.obj"></a-asset-item>
        <a-asset-item id="bird-mtl" src="./10012_crab_v2_iterations-1.mtl"></a-asset-item>
      </a-assets>
      
      <a-entity 
        id="ar-object"
        gps-entity-place="latitude: 10.4212398; longitude: 105.6433481;"
        position="0 0 0"
        scale="0.25 0.25 0.25"
        rotation="0 0 0"
        visible="false">
        
        <a-obj-model src="#bird-obj" mtl="#bird-mtl"></a-obj-model>
      </a-entity>
      
      <a-entity camera gps-camera="gpsMinDistance: 1; maxDistance: 100;" rotation-reader></a-entity>
      
    </a-scene>

    <script>
      const arObject = document.getElementById('ar-object');
      const hud = document.getElementById('distance-hud');

      // Lắng nghe sự kiện ngay khi camera nhận tín hiệu GPS đầu tiên
      window.addEventListener('gps-camera-update-position', (e) => {
        // Dự phòng nếu hệ thống chưa kịp tính khoảng cách tự động
        const distance = arObject.components['gps-entity-place'] ? arObject.components['gps-entity-place'].distance : null;

        if (distance !== null && distance !== undefined) {
          const roundedDistance = Math.round(distance);
          
          if (roundedDistance <= 100) {
            arObject.setAttribute('visible', 'true');
            hud.innerHTML = `Đã kích hoạt! Cách mục tiêu: ${roundedDistance}m`;
            hud.style.background = "rgba(46, 204, 113, 0.9)";
          } else {
            arObject.setAttribute('visible', 'false');
            hud.innerHTML = `Mục tiêu ở xa: ${roundedDistance}m (Hãy lại gần < 100m)`;
            hud.style.background = "rgba(231, 76, 60, 0.9)";
          }
        } else {
          hud.innerHTML = "Đã nhận GPS. Đang tính khoảng cách...";
        }
      });

      // Tự động kiểm tra nếu trình duyệt từ chối quyền định vị
      navigator.geolocation.getCurrentPosition(
        () => {}, 
        (err) => {
          hud.innerHTML = "Lỗi: Trình duyệt bị chặn quyền truy cập GPS!";
          hud.style.background = "red";
        }
      );
    </script>
  </body>
</html>
